<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060d" />

    <title>Harrith — Creative Developer</title>
    <meta
      name="description"
      content="An interactive 3D portfolio. Drop into a city at dusk, then walk its streets to find the work."
    />

    <link rel="canonical" href="https://drift-wood-seven.vercel.app/" />

    <!-- Open Graph / social.
         The card declared `summary_large_image` with no image behind it, which
         renders worse than declaring nothing: LinkedIn, Slack and WhatsApp all
         drew an empty box. `og:image` must be an absolute URL — scrapers do not
         resolve relative paths — and the dimensions let them reserve the space
         before the file arrives. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://drift-wood-seven.vercel.app/" />
    <meta property="og:title" content="Harrith — Creative Developer" />
    <meta
      property="og:description"
      content="An interactive 3D portfolio. Drop into a city at dusk, then walk its streets to find the work."
    />
    <meta property="og:image" content="https://drift-wood-seven.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A character on a stairway in a Lima street at dusk, tower blocks in the distance."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://drift-wood-seven.vercel.app/og-image.jpg" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- The character mesh and city are needed the moment the loop starts. -->
    <link rel="preload" as="fetch" href="assets/models/character.glb" crossorigin />
    <link rel="preload" as="fetch" href="assets/models/city.glb" crossorigin />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
