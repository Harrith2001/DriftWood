@if (noWebgl()) {
  <!-- No WebGL: the readable document becomes the page. -->
  <app-readable-portfolio
    [standalone]="true"
    reason="This browser cannot run WebGL, so the 3D city is not available here. The work is all below."
  />
} @else {
<div class="stage">
  <!-- The scene. aria-hidden because everything it conveys is mirrored in the
       overlays and panels, which are the accessible representation. -->
  <canvas #canvas class="stage__canvas" aria-hidden="true"></canvas>

  <!-- Film grain, purely decorative -->
  <div class="stage__grain" aria-hidden="true"></div>

  <app-loader-overlay
    [progress]="state.loadProgress()"
    [error]="state.loadError()"
    [dismissed]="loaderDismissed()"
    (retry)="retryLoad()"
  />

  @if (showIntro()) {
    <app-intro-overlay
      [leaving]="introLeaving()"
      (begin)="beginArrival()"
      (skip)="skipArrival()"
    />
  }

  @if (state.isExploring()) {
    <app-hud
      [nearby]="state.nearbyHotspot()"
      [discovered]="state.discovered()"
      [hidden]="state.openPanel() !== null"
      [touch]="isTouch()"
      [capsFound]="state.capsFound()"
      [totalCaps]="state.totalCaps"
      [lastCap]="state.lastCap()"
      (interact)="requestInteract()"
      (jumpTo)="jumpTo($event)"
      (openReward)="openPanel('colophon')"
    />

    @if (isTouch() && state.openPanel() === null) {
      <app-touch-controls
        (axes)="onTouchAxes($event)"
        (interact)="requestInteract()"
        (jump)="requestJump()"
      />
    }
  }

  <app-content-panel [panelId]="state.openPanel()" (close)="closePanel()" />

  <!-- Always in the DOM: crawlers, link previews and screen readers get the
       whole portfolio without anyone having to walk a character to a beacon. -->
  <app-readable-portfolio />
</div>
}
