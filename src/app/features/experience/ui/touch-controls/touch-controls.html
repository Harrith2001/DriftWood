<div class="touch">
  <div
    class="stick"
    (pointerdown)="onDown($event)"
    (pointermove)="onMove($event)"
    (pointerup)="onUp($event)"
    (pointercancel)="onUp($event)"
    (pointerleave)="onUp($event)"
    role="application"
    aria-label="Movement joystick"
  >
    <div class="stick__base" aria-hidden="true"></div>
    <div
      class="stick__knob"
      aria-hidden="true"
      [style.transform]="'translate(' + knobX() + 'px,' + knobY() + 'px)'"
    ></div>
  </div>

  <div class="actions">
    <button type="button" class="action action--jump" (click)="jump.emit()" aria-label="Jump">
      Jump
    </button>
    <button type="button" class="action" (click)="interact.emit()" aria-label="Open location">
      E
    </button>
  </div>
</div>
